[package]
name = "moth_flux"
version = "0.1.0"
edition = "2021"

# ⚠ THE COMPARATOR IS rkyv, NOT JSON. Beating serde_json proves nothing — nobody serious uses JSON
#   where this matters, and a baseline built to lose is how you launder a null result into a win.
#   serde_json is kept ONLY as a labelled floor so the absolute numbers have a familiar anchor.
[dependencies]
rkyv = { version = "0.7", features = ["validation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytecheck = "0.6"
# The FLUX compiler (proc-macro, zero deps of its own). Lives in this directory because it is
# not a language yet - it is one constrained expression form and its refusals.
flux_macro = { path = "flux_macro" }

[workspace]
members = ["flux_macro"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
